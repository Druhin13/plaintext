[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauf-stability"
version = "0.1.0"
description = "Context-stability measurement and overhead model for post-hoc text fingerprinting"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
exact = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
