name: Materialize verified research baseline

on:
  push:
    branches:
      - research-baseline
    paths:
      - ".baseline/**"
      - ".github/workflows/materialize-baseline.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research-baseline

      - name: Reconstruct and verify exact tested archive
        shell: bash
        run: |
          set -euo pipefail
          {
            for n in 00 01 02 03 04 05 06 07 08 09; do
              cat ".baseline/chunk_${n}.b64"
            done
            cat .baseline/chunk_10a.b64 .baseline/chunk_10b.b64
            cat .baseline/chunk_11a.b64 .baseline/chunk_11b.b64
            cat .baseline/chunk_12.b64
          } > /tmp/baseline.b64

          test "$(wc -c < /tmp/baseline.b64)" -eq 121416
          base64 --decode /tmp/baseline.b64 > /tmp/baseline_code.tar.xz
          echo "28317c71a8a21972efe61b3ef8fc625139f5bbe2ebb972576f7eb5837469b30f  /tmp/baseline_code.tar.xz" | sha256sum -c -

          tar -xJf /tmp/baseline_code.tar.xz -C .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .baseline

      - name: Verify preregistered baseline parameters
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'n_anchor_sites[[:space:]]*=[[:space:]]*400' surface.py
          grep -Eq 'seed_bits[[:space:]]*=[[:space:]]*10' surface.py

      - name: Run research baseline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pytest tests/ -q

      - name: Commit verified materialized baseline
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: materialize verified research baseline"
          git push origin HEAD:research-baseline
